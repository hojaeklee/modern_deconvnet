[project]
name = "modern-deconvnet"
version = "0.1.0"
description = "Zeiler & Fergus deconvnet visualizations on modern PyTorch, via Captum"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "captum>=0.9.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.optional-dependencies]
# Only needed for `--model vgg16-keras` (original Caffe VGG16 weights).
keras = ["h5py>=3.16.0"]

[project.scripts]
modern-deconvnet = "modern_deconvnet.cli:main"
modern-deconvnet-sanity = "modern_deconvnet.sanity_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
